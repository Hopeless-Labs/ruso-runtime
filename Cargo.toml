[package]
name = "ruso-runtime"
version = "0.1.0"
edition = "2024"
description = "Ruso bytecode VM and execution runtime"
license = "MIT OR Apache-2.0"

[lib]
name = "ruso_runtime"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
regex = "1.11"
tracing = "0.1"
